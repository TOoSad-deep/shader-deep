# 分析模块专用运行配置; 默认按模块位置加载, 不依赖启动目录.
# 可用 --config 指定其他文件.
# 命令行显式参数优先, 省略字段使用 AnalysisOptions 的内置默认值.

# 新分析每轮一批, 默认三个独立视角; 可设 2 或 3, 重试不增加视角.
max_tasks: 3
# 同时运行的视角子任务数.
max_parallel: 3
# 每个子任务的可选调用上限; 0 表示不限总调用, 修复仍按逻辑任务共两次.
max_worker_calls: 0
# 主 Agent 的可选调用上限; 0 表示不限总调用.
max_main_calls: 0
# 主任务连续同错、同内容且无新材料时的停止阈值; 0 不自动停止.
max_repeated_no_progress: 0
# 唯一取证操作上限, 相同规格的缓存命中不重复扣除.
max_measurements: 8

# 单次逻辑模型调用额外允许的网络重试次数, 可为 0.
max_request_retries: 2
# 每次网络请求的超时秒数, 不是整个分析流程的总耗时上限.
request_timeout_seconds: 240
# 通用输出 token 预算; 阶段值未设置时回退此值, 通用 CLI 优先于阶段 YAML.
max_output_tokens: 163840
# 可选阶段覆盖; null 保持通用回退, 不自动启用文档中的实验值.
outline_max_output_tokens: null
integration_max_output_tokens: null
worker_max_output_tokens: null
# 显式比较目标上限与目录/工作索引单页字符预算.
max_comparison_targets: 12
library_page_chars: 8000
# 是否使用 SSE 流式传输; 收齐并校验响应后才执行工具.
stream_model_responses: true

# 相对路径基于本 YAML 所在目录; null 表示当前工作目录下的 runs.
output_dir: null

# 完整请求的应用估算预算, 包含输出预留; 不是提供方窗口声明.
# 文本按每字符一个估算 token, 图像另加预留; 实际用量仍读取服务返回值.
max_context_tokens: 262144
request_image_tokens: 4096
request_token_margin: 2048
# 每比较组或发现阶段/初稿阶段最多调用次数, 包含修复; 阶段总数包含刷新、复核及最终结束.
max_integration_calls: 12
max_integration_packages: 24
integration_no_progress: 3
# 为本包决定与局部修复历史保留的估算 token; 不占用候选数量额度.
integration_history_tokens: 16384
